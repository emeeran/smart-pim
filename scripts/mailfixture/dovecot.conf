dovecot_config_version = 2.4.3
dovecot_storage_version = 2.4.3

base_dir = /run/dovecot
state_dir = /run/dovecot
log_path = /dev/stdout
info_log_path = /dev/stdout
listen = *
ssl = no
default_login_user = vmail
default_internal_user = vmail
default_internal_group = vmail
first_valid_uid = 100

protocols = imap pop3

mail_driver = maildir
mailbox_list_layout = fs
mail_path = %{home}/Maildir
mail_home = /srv/vmail/%{user | lower}
mail_uid = vmail
mail_gid = vmail

passdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}
userdb static {
  userdb_fields {
    home = /srv/vmail/%{user | lower}
  }
}

service imap-login {
  inet_listener imap {
    port = 10143
  }
  process_min_avail = 1
  client_limit = 100
}
service pop3-login {
  inet_listener pop3 {
    port = 10110
  }
  process_min_avail = 1
  client_limit = 100
}
auth_allow_cleartext = yes
