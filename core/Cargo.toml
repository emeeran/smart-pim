[package]
name = "core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Smart PIM core engine: store, search, import/export, mail store"

# The crate is named `core`; when rustdoc recompiles it for doctests cargo
# passes `--extern core=<this crate>`, which hijacks the `::core::…` paths
# thiserror's derive emits (the crate has no doc examples anyway).
[lib]
doctest = false

[lints]
workspace = true

[dependencies]
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl", "functions", "series"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
argon2 = "0.5"
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
thiserror = "2"
zeroize = "1"
ahash = "0.8"
csv = "1.4.0"
mail-parser = "0.11.9"
chrono-tz = "0.10.4"
rrule = "0.14.0"

[dev-dependencies]
tempfile = "3"
